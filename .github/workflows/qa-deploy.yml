name: QA y Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  qa:
    name: Seguridad, build y reporte
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint --if-present

      - name: Auditoría de seguridad de endpoints
        id: security
        run: node scripts/security-check.mjs --json | tee security-report.json

      - name: Build
        run: npm run build

      - name: Generar estadísticas del cambio
        id: stats
        run: |
          FILES_CHANGED=$(git diff --name-only HEAD~1 HEAD | wc -l)
          INSERTIONS=$(git diff --shortstat HEAD~1 HEAD | grep -oP '\d+(?= insertion)' || echo 0)
          DELETIONS=$(git diff --shortstat HEAD~1 HEAD | grep -oP '\d+(?= deletion)' || echo 0)
          echo "files_changed=$FILES_CHANGED" >> "$GITHUB_OUTPUT"
          echo "insertions=$INSERTIONS" >> "$GITHUB_OUTPUT"
          echo "deletions=$DELETIONS" >> "$GITHUB_OUTPUT"

      - name: Publicar resumen en GitHub
        run: |
          {
            echo "## Reporte de QA / Deploy"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Autor:** ${{ github.actor }}"
            echo ""
            echo "### Estadísticas del cambio"
            echo "- Archivos modificados: ${{ steps.stats.outputs.files_changed }}"
            echo "- Líneas agregadas: ${{ steps.stats.outputs.insertions }}"
            echo "- Líneas eliminadas: ${{ steps.stats.outputs.deletions }}"
            echo ""
            echo "### Auditoría de seguridad de endpoints"
            echo '```json'
            cat security-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar en el commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('security-report.json', 'utf-8'));
            const problems = report.problems || [];
            const status = problems.length === 0 ? '✅ Sin problemas de seguridad detectados' : `⚠️ ${problems.length} endpoint(s) con seguridad inadecuada`;

            const lines = report.report.map(r => {
              const icon = (r.status === 'PROTECTED' || r.status === 'PUBLIC_BY_DESIGN') ? '✅' : r.status === 'PUBLIC_DOCUMENTED' ? '⚠️' : '❌';
              return `- ${icon} \`${r.apiPath}\` [${r.methods.join(', ') || '?'}] -> ${r.status}`;
            }).join('\n');

            const body = [
              `### Reporte automático de QA/Deploy`,
              ``,
              `**Estado de seguridad:** ${status}`,
              ``,
              `**Endpoints auditados:**`,
              lines,
              ``,
              `_Generado automáticamente por el workflow qa-deploy.yml_`
            ].join('\n');

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });

      - name: Fallar el pipeline si hay endpoints inseguros no documentados
        run: node scripts/security-check.mjs
